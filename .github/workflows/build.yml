name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Build version tag (optional)"
        required: false
        default: ""

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA (unsigned, TrollStore-ready)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build settings (debug)
        run: xcodebuild -project QinglongClientPro.xcodeproj -scheme QinglongClientPro -showBuildSettings | head -40

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project QinglongClientPro.xcodeproj \
            -scheme QinglongClientPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/QinglongClientPro.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/QinglongClientPro.xcarchive/Products/Applications/QinglongClientPro.app" build/Payload/
          cd build && zip -r QinglongClientPro.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QinglongClientPro-ipa
          path: build/QinglongClientPro.ipa
          if-no-files-found: error

      - name: Upload IPA to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/QinglongClientPro.ipa

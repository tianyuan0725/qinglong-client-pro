name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Build version tag (optional)"
        required: false
        default: ""

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA (unsigned, TrollStore-ready)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject update-check token (build-time secret)
        env:
          UPDATE_CHECK_TOKEN: ${{ secrets.UPDATE_CHECK_TOKEN }}
        run: |
          if [ -n "$UPDATE_CHECK_TOKEN" ]; then
            sed -i '' "s/REPLACE_WITH_GITHUB_TOKEN/$UPDATE_CHECK_TOKEN/g" QinglongClientPro/UpdateChecker.swift
            echo "update-check token injected"
          else
            echo "WARNING: secrets.UPDATE_CHECK_TOKEN not set; update check will be unauthenticated (401)"
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build settings (debug)
        run: xcodebuild -project QinglongClientPro.xcodeproj -scheme QinglongClientPro -showBuildSettings | head -40

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project QinglongClientPro.xcodeproj \
            -scheme QinglongClientPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/QinglongClientPro.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/QinglongClientPro.xcarchive/Products/Applications/QinglongClientPro.app" build/Payload/
          cd build && zip -r QinglongClientPro.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QinglongClientPro-ipa
          path: build/QinglongClientPro.ipa
          if-no-files-found: error

      - name: Read app version
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        id: ver
        run: |
          V=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' QinglongClientPro/Info.plist)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "app version: $V"

      - name: Publish Release (auto)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 青龙客户端 Pro v${{ steps.ver.outputs.version }}
          # 更新说明取自仓库根目录 RELEASE_NOTES.md（每次发版同步维护）
          body_path: RELEASE_NOTES.md
          files: build/QinglongClientPro.ipa

      - name: Upload IPA to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/QinglongClientPro.ipa
